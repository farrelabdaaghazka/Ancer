<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#110c1b',    
                        surface: '#1a1625', 
                        border: 'rgba(255, 255, 255, 0.06)', 
                        purpleAcc: '#834DFB',
                        yellowAcc: '#F0E100',
                        greenAcc: '#22c55e',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .ancer-tile { filter: invert(1) hue-rotate(210deg) brightness(0.72) saturate(0.5) contrast(1.12); }
        .leaflet-container { background: #090714 !important; }
        .leaflet-control-attribution, .leaflet-control-zoom { display: none !important; }
        
        @keyframes ancerPulse {
            0%   { transform: scale(1);   opacity: 0.85; }
            70%  { transform: scale(3.5); opacity: 0; }
            100% { transform: scale(1);   opacity: 0; }
        }
        .pulse-layer { animation: ancerPulse 1.8s ease-out infinite; }
        
        .node-transition { transition: all 0.4s linear; }
    </style>
</head>
<body class="bg-base text-white font-sans flex min-h-screen overflow-hidden">

    <aside class="w-20 h-screen sticky top-0 border-r border-border flex flex-col items-center py-6 shrink-0 bg-surface z-50">
        <div class="w-10 h-10 bg-[#834DFB] rounded-xl flex items-center justify-center cursor-pointer hover:bg-purple-500 transition">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <nav class="my-auto flex flex-col gap-4 w-full items-center">
            <label class="group relative w-12 h-12 cursor-pointer flex items-center justify-center shrink-0">
                <input type="radio" name="sidebar-menu" class="peer hidden" checked>
                <div class="absolute inset-0 rounded-2xl flex items-center justify-center transition-all duration-200 text-gray-500 hover:text-white hover:bg-white/10 peer-checked:bg-[#834DFB]">
                    <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="9" rx="1.5"></rect><rect x="4" y="16" width="6" height="4" rx="1.5"></rect><rect x="13" y="4" width="7" height="4" rx="1.5"></rect><rect x="13" y="11" width="7" height="9" rx="1.5"></rect></svg>
                </div>
            </label>
        </nav>
    </aside>

    <main class="flex-1 p-10 flex flex-col h-screen overflow-hidden">
        <div class="flex justify-between items-start mb-8 shrink-0">
            <div>
                <div class="text-[#834DFB] text-[11px] font-bold tracking-[2px] mb-2 uppercase">Module B</div>
                <h1 class="text-3xl font-extrabold text-[#F5F3FF] tracking-tight">Live Radar</h1>
            </div>
            <div class="flex gap-1 bg-[#1e1235] border border-[#341F60] rounded-xl p-1 relative z-30">
                <button id="toggle-map-btn" class="px-4 py-2 rounded-lg text-sm font-semibold bg-[#834DFB] text-white">Map View</button>
                <button id="toggle-nav-btn" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-400">Active Navigation</button>
            </div>
        </div>

        <div id="display-container" class="flex-1 border border-[#251f4f] rounded-3xl overflow-hidden relative shadow-2xl min-h-[480px]">
            
            <div id="map-view-layer" class="absolute inset-0 z-10 flex flex-col justify-between">
                <div id="leaflet-map-mount" class="absolute inset-0 z-0"></div>
                
                <div class="absolute top-5 left-1/2 -translate-x-1/2 w-[480px] z-[1000]">
                    <div class="flex items-center gap-3 bg-[#0c071ae6] border border-[#341F60] rounded-xl p-4 backdrop-blur-xl shadow-xl">
                        <input id="search-station-input" type="text" placeholder="Search MRT Jakarta stations…" class="flex-1 bg-transparent border-none text-sm text-[#F5F3FF] outline-none">
                    </div>
                </div>

                <div class="absolute bottom-5 left-5 bg-[#120e2b99] border border-[#251f4f] rounded-xl p-4 backdrop-blur-xl z-[1000] space-y-2">
                    <div class="text-[10px] font-bold text-gray-400 tracking-wider mb-2">TRANSIT LINES</div>
                    <div id="legend-mrt" class="flex items-center gap-2"><div class="w-4 h-[3px] bg-[#834DFB] rounded shadow-[0_0_6px_#834DFB]"></div><span class="text-xs text-gray-300">MRT Jakarta</span></div>
                    <div id="legend-tj" class="flex items-center gap-2 opacity-40"><div class="w-4 h-[3px] bg-[#F0E100] rounded"></div><span class="text-xs text-gray-400">TransJakarta</span></div>
                    <div id="legend-krl" class="flex items-center gap-2 opacity-40"><div class="w-4 h-[3px] bg-[#22c55e] rounded"></div><span class="text-xs text-gray-400">KRL Commuter</span></div>
                </div>

                <div class="absolute bottom-5 left-1/2 -translate-x-1/2 bg-[#0c071ae6] border border-[#251f4f] rounded-xl p-2 backdrop-blur-xl z-[1000] flex gap-1.5">
                    <button id="chip-MRT" class="px-3.5 py-2 rounded-lg text-xs font-bold border border-[#834DFB] bg-[#834DFB]1a text-[#834DFB]">MRT Jakarta</button>
                    <button id="chip-TJ" class="px-3.5 py-2 rounded-lg text-xs font-bold text-gray-500">TransJakarta</button>
                    <button id="chip-KRL" class="px-3.5 py-2 rounded-lg text-xs font-bold text-gray-500">KRL Commuter</button>
                </div>

                <button id="start-nav-btn" class="absolute bottom-5 right-5 bg-[#834DFB] text-white px-5 py-3 rounded-xl text-sm font-bold z-[1000]">Start Navigation</button>
            </div>

            <div id="active-nav-layer" class="absolute inset-0 bg-[#090714] z-20 hidden flex-col justify-center px-12">
                <div class="absolute inset-0 opacity-5 pointer-events-none" id="grid-canvas"></div>

                <div id="alert-banner" class="absolute top-5 left-1/2 -translate-x-1/2 w-[600px] z-30 transition-all duration-300 transform scale-100">
                    <div class="bg-yellow-500/10 border border-yellow-500/30 rounded-xl p-4 flex items-center gap-3 backdrop-blur-md">
                        <svg class="w-4 h-4 text-[#F0E100] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <span id="banner-text" class="flex-1 text-xs font-semibold text-[#F5F3FF]">Warning Banner Text</span>
                        <button id="reroute-btn" onclick="triggerReroute()" class="bg-[#F0E100] text-[#18102B] text-[11px] font-extrabold px-3 py-1.5 rounded-lg hover:opacity-90 transition shrink-0">Reroute Seamlessly</button>
                        <button onclick="dismissBanner()" class="text-gray-500 hover:text-white transition"><svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg></button>
                    </div>
                </div>

                <button id="map-return-btn" class="absolute top-5 right-5 flex items-center gap-2 bg-[#0d071ae6] border border-[#341F60] rounded-xl px-4 py-2.5 text-sm font-semibold text-gray-300 hover:text-white transition backdrop-blur-md z-30">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                    Map View
                </button>

                <div class="flex items-center w-full h-full pt-16">
                    <div class="w-[320px] bg-[#120e2b99] border border-[#251f4f] rounded-2xl p-6 backdrop-blur-xl shrink-0 z-10 shadow-xl space-y-5">
                        <div>
                            <div id="cp-header-label" class="text-[10px] font-bold tracking-wider mb-4">CHECKPOINT STATUS</div>
                            <div class="text-xs text-gray-400 mb-1" id="cp-active-title">Active Station</div>
                            <div id="cp-active-name" class="text-xl font-extrabold text-[#F5F3FF] tracking-tight leading-none">Blok M Transit</div>
                        </div>
                        <div class="space-y-3.5 border-b border-[#341F60] pb-5 text-xs">
                            <div class="flex justify-between"><span class="text-gray-400" id="cp-next-title">Next Station</span><span id="cp-next-name" class="font-semibold text-white">Sisingamangaraja</span><span id="cp-next-eta" class="font-bold">3 min</span></div>
                            <div class="flex justify-between"><span class="text-gray-400">ETA Destination</span><span id="cp-dest-name" class="font-semibold text-white">Bundaran HI</span><span id="cp-dest-eta" class="font-bold">24 min</span></div>
                            <div class="flex justify-between"><span class="text-gray-400">Remaining</span><span id="cp-remaining-val" class="font-semibold text-white">4 stations</span></div>
                        </div>
                        <div class="flex justify-between items-center">
                          <div>
                              <div class="text-[10px] text-gray-400 mb-0.5">Integrated Fare</div>
                              <div id="cp-fare" class="text-xl font-extrabold text-[#F0E100]">Rp14.000</div>
                          </div>
                          <div id="cp-badge" class="rounded-lg px-2.5 py-1 text-[10px] font-bold tracking-wide border">STATUS</div>
                        </div>
                    </div>

                    <div class="flex-1 pl-12 flex flex-col justify-center relative">
                        <div id="track-line-name" class="text-[9px] font-bold tracking-[2px] text-center mb-8 uppercase text-gray-500">LINE NAME</div>
                        <div class="relative w-full flex items-center justify-between" id="timeline-node-container"></div>
                    </div>
                </div>

                <button id="nav-close-btn" class="absolute bottom-6 right-6 w-14 h-14 bg-red-500/80 hover:bg-red-500 text-white rounded-full flex items-center justify-center shadow-lg transition transform hover:scale-105 z-30">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

        </div>
    </main>
</body>
</html>
