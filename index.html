<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANCER</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#F5F3FF] text-[#18102B]">

    <div id="app">
        <nav class="fixed top-0 left-0 right-0 z-50 h-[80px] bg-[#F5F3FF]/85 backdrop-blur-[20px] border-b border-[#834DFB]/12">
            <div class="max-w-7xl mx-auto flex items-center justify-between h-full px-20">

                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center rounded-xl w-9 h-9 bg-[#834DFB]">
                        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="6" cy="19" r="3"/>
                            <circle cx="18" cy="5" r="3"/>
                            <path d="M9 19h4.5a3.5 3.5 0 0 0 3.5-3.5V8.5a3.5 3.5 0 0 1 3.5-3.5H15"/>
                        </svg>
                    </div>
                    <span class="font-extrabold text-[20px] tracking-[-0.5px]">ANCER</span>
                </div>
                
                <div class="flex items-center gap-1">
                    <div class="relative" @mouseenter="openMenu = 'features'" @mouseleave="openMenu = null">
                        <button :class="openMenu === 'features' ? 'text-[#834DFB]' : 'text-[#18102B]/60'" class="flex items-center gap-1.5 px-3.5 py-2.5 text-[15px] font-medium rounded-auto cursor-pointer transition-colors duration-150">
                            Features
                            <svg :class="openMenu === 'features' ? 'rotate-180 text-[#834DFB]' : 'rotate-0 text-[#18102B]/40'" class="w-3.5 h-3.5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                        <div v-show="openMenu === 'features'" class="absolute top-[calc(100%+14px)] left-1/2 -translate-x-1/2 w-[540px] bg-white rounded-[16px] shadow-[0_16px_56px_rgba(24,16,43,0.16),0_0_0_1px_rgba(131,77,251,0.08)] z-50 overflow-hidden">
                            
                            <div class="p-[18px_20px_14px] border-b border-[#18102B]/6">
                                <div class="text-[#834DFB] text-[10px] font-bold tracking-[1.8px] mb-1">PLATFORM MODULES</div>
                                <div class="text-[#18102B] text-sm font-semibold">Explore what ANCER offers</div>
                            </div>
                            
                            <div class="p-4 grid grid-cols-2 gap-3" id="features-grid-container">
                            
                </div>

            </div>
        </nav>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const openMenu = ref(null);
                const hoveredIndex = ref(null);
                return {
                    openMenu,
                    hoveredIndex
                }
            }
        }).mount('#app'); 
    </script>
</body>
</html>
